; ==========================================================
; 建筑配置文件模板
; 适用类: BuildingStats (GDExtension)
; ==========================================================

building_name_key = KEY_BUILDING_HANGAR
[Identity]
; 建筑名称
building_name=Hangar
; 建筑类型: Generic, Barracks, Turret, Collector, Storage (对应枚举 BuildingType)
building_type=Barracks
; land, water, on_resource
placement = land

[Economy]
; 建造消耗资源
cost=600
; 建造所需时间 (单位: 秒)
build_time=12.0

[Stats]
; 最大生命值
health_max=1800.0

[Grid]
; 物理占地大小 (Vector2i): 建筑实际阻挡的网格数 (例如 2,2 表示 2x2 格子)
footprint=1,1
; 放置间距 (Vector2i): 放置时要求的清理范围，通常等于或大于 footprint
clearance=3,3

[Visuals]
; 纹理文件路径 (256x48 = 8 帧 x 32x48)
texture_path=res://asset/building/hangar.png
; 图集分栏 (整个贴图有多少列和多少行)
h_frames=8
; 图集分栏
v_frames=1
; 动画播放帧率
anim_fps=8

[Animation]
; 建造中动画帧数 (1 = 只显示第0帧，即待机帧，静止)
building_frames=1
; 待机动画帧数 (取第1帧为待机帧，静止)
idle_frames=1
; 待机动画所在的行号 (从0开始)
idle_row=0
; 生产中动画帧数 (生产过程中保持第0帧静止)
working_frames=1
; 生产中动画所在的行号
working_row=0
; 生产完成时一次性播放的动画帧数 (播放全部 8 帧，播放完自动回到第0帧)
finish_frames=8

; ----------------------------------------------------------
; 以下为专项属性，根据 building_type 的不同选择性填写
; ----------------------------------------------------------

[Barracks]
; 可生产的单位列表 (字符串数组，用逗号分隔，名称需与 register_unit_type 对应)
producible_units=Fighter,Helicopter,AttackHelicopter
; 生产速度倍率 (1.0为标准)
production_speed=1.0

[Turret]
; 攻击力
attack_damage=40.0
; 攻击范围 (单位: 世界坐标像素)
attack_range=400.0
; 攻击间隔 (单位: 秒)
attack_interval=1.0

[Collector]
; 采集资源类型: Gold, Wood, Energy 等
resource_type=Gold
; 每秒采集速率
collection_rate=10.0
; 内部存储上限
collection_capacity=500.0
