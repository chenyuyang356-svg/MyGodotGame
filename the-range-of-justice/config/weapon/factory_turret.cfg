; 武器系统注册名 (必须，Building配置文件靠这个名字挂载武器)
weapon_name = factory_turret

; ================= 战斗属性 =================
; 工厂装饰炮塔：不参与攻击，仅随工厂生产状态旋转
projectile_type_name = MarineBullet
damage = 0.0
attack_range = 0.0
attack_interval = 99999.0
can_attack_ground = false
can_attack_air = false

; ================= 炮塔系统 =================
; true: 拥有独立旋转系统(炮塔)； false: 朝向与底盘主体死锁(例如机头航炮)
is_turret = true
; 武器独自旋转的角速度 (弧度/秒)：发现敌人后转到目标方位
turn_speed = 1.57
; 本武器的旋转由所属建筑的 turret_spin 配置驱动：
; 建筑生产单位时缓慢自转，生产结束保持当前朝向
; 武器的旋转中心 (32x48 单帧图集，画面在上半部，轴心取屏幕面板中心)
rotation_center = -0.5, -17.0
; 枪口位置 (装饰炮塔不发射，仅占位)
muzzle_offset = 0.0, 12.0, 4.0

; ================= 渲染与动画 =================
; 武器贴图(Sprite Sheet) 路径 (32x48 单帧，工厂雷达屏炮塔)
texture_path = res://asset/weapon/war_factory_turrent.png
; 图集横向切分数量
h_frames = 1
; 图集纵向切分数量
v_frames = 1
; 每秒播放的动画帧数
anim_fps = 10

; -- 待机状态 --
; 待机动画占用几帧
idle_frames = 1
; 待机动画在第几行 (从0开始计)
idle_row = 0

; -- 攻击状态 --
; 开火动画占用几帧 (不攻击时永不播放)
attacking_frames = 1
; 开火动画在第几行 (从0开始计)
attacking_row = 0
