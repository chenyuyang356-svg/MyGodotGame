; 武器系统注册名 (必须，Building配置文件靠这个名字挂载武器)
weapon_name = machine_gun_bunker_turrent

; ================= 战斗属性 =================
; 发射的子弹/炮弹的视觉模型名称，交由 ProjectileManager 识别
projectile_type_name = MarineBullet
; 伤害值
damage = 10.0
; 最大射程
attack_range = 420.0
; 开火间隔（冷却时间/秒）
attack_interval = 0.35
; 子弹飞行速度
projectile_speed = 900.0
; 爆炸溅射半径 (0表示单体伤害)
splash_radius = 0.0
; 能否攻击地面
can_attack_ground = true
; 能否攻击空中
can_attack_air = true

; ================= 炮塔系统 =================
; true: 拥有独立旋转系统(炮塔)； false: 朝向与底盘主体死锁(例如机头航炮)
is_turret = true
; 武器独自旋转的角速度 (弧度/秒)：发现敌人后转到目标方位
turn_speed = 3.14
; 未配置 idle_rotate_speed，空闲时炮塔保持静止不动
; 武器的旋转中心
rotation_center = 0.0, -3.0
; 枪口位置
muzzle_offset = 0.0, 12.0, 4.0

; ================= 渲染与动画 =================
; 武器贴图(Sprite Sheet) 路径 (2 帧开火动画)
texture_path = res://asset/weapon/machine_gun_bunker_turrent.png
; 图集横向切分数量
h_frames = 2
; 图集纵向切分数量
v_frames = 1
; 每秒播放的动画帧数
anim_fps = 20

; -- 待机状态 --
; 待机动画占用几帧
idle_frames = 1
; 待机动画在第几行 (从0开始计)
idle_row = 0

; -- 攻击状态 --
; 开火动画占用几帧 (2 帧开火动画，在发射瞬间播放)
attacking_frames = 2
; 开火动画在第几行 (从0开始计)
attacking_row = 0


; 枪口开火特效配置
muzzle_flash = true
flash_preset = autogun
flash_scale = 9.0
flash_life = 0.07
muzzle_flash_angle = 90.0
flash_trigger_frame = 0